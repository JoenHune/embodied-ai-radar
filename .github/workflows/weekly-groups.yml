name: Weekly v3 data-only fallback

on:
  schedule:
    # Monday 04:00 Asia/Shanghai = Sunday 20:00 UTC.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with push deployment so artifacts cannot race.
concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  update-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      performed: ${{ steps.update.outputs.performed }}
      week: ${{ steps.snapshot.outputs.week }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read last completed ISO-week snapshot
        id: snapshot
        run: python scripts/run_weekly_v3.py --check-snapshot >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.snapshot.outputs.ready != 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.snapshot.outputs.ready != 'true'
        run: python -m pip install -r requirements-v3.txt
      - if: steps.snapshot.outputs.ready != 'true'
        run: npm ci
      - name: Collect, ingest, verify and persist missing snapshot without LLM
        id: update
        if: steps.snapshot.outputs.ready != 'true'
        run: |
          git config user.name "embodied-ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/run_weekly_v3.py --publish --fallback --data-only
          if [[ -f docs/.vitepress/dist/index.html ]]; then
            echo "performed=true" >> "$GITHUB_OUTPUT"
          else
            echo "performed=false" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger another push workflow. This workflow
      # deploys its own already-verified artifact.
      - uses: actions/configure-pages@v5
        if: steps.update.outputs.performed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.update.outputs.performed == 'true'
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: update-build
    if: needs.update-build.outputs.performed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  feishu-weekly:
    needs: [update-build, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v3.txt
      - name: Deliver or persist pending Feishu report after website succeeds
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_INDEX_DOC_TOKEN: ${{ secrets.FEISHU_INDEX_DOC_TOKEN }}
          REPORT_WEEK: ${{ needs.update-build.outputs.week }}
        run: python scripts/publish_group_weekly_to_feishu.py --week "$REPORT_WEEK"
      - name: Persist delivery progress and retry queue independently of website
        if: always()
        run: |
          if [[ -f data/feishu-weekly-deliveries.json ]]; then
            git config user.name "embodied-ai-radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- data/feishu-weekly-deliveries.json
            if ! git diff --cached --quiet; then
              git commit -m "data: Feishu delivery state [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
