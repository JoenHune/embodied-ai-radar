name: Deploy verified v3 research radar

on:
  push:
    branches: [main]
    paths-ignore:
      - data/feishu-weekly-deliveries.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      report_week: ${{ steps.snapshot.outputs.week }}
      report_ready: ${{ steps.snapshot.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -r requirements-v3.txt
      - run: npm ci
      - name: Verify process-local SQLite capabilities
        run: node scripts/run-python.mjs -c "import sqlite3; print('SQLite runtime:', sqlite3.sqlite_version)"
      - name: Read verified report week
        id: snapshot
        run: python scripts/run_weekly_v3.py --check-snapshot >> "$GITHUB_OUTPUT"
      - name: Verify facts and build derived site (no migration, collection or LLM)
        run: npm test
      - name: Require tracked facts to remain unchanged
        run: git diff --exit-code -- data/catalog data/editorial data/conferences
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4

  feishu-weekly:
    needs: [build, deploy]
    if: needs.deploy.result == 'success' && needs.build.outputs.report_ready == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v3.txt
      - name: Publish verified weekly digest after website deployment
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_INDEX_DOC_TOKEN: ${{ secrets.FEISHU_INDEX_DOC_TOKEN }}
          REPORT_WEEK: ${{ needs.build.outputs.report_week }}
        run: python scripts/publish_group_weekly_to_feishu.py --week "$REPORT_WEEK"
      - name: Persist delivery or pending retry state
        if: always()
        run: |
          if [[ -f data/feishu-weekly-deliveries.json ]]; then
            git config user.name "embodied-ai-radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- data/feishu-weekly-deliveries.json
            if ! git diff --cached --quiet; then
              git commit -m "data: Feishu delivery state [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
